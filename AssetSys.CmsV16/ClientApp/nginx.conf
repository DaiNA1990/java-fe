server {
    # nginx runs as a non-root user, which cannot bind ports below 1024.
    # Must match EXPOSE in the Dockerfile and the containerPort used when deploying.
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # The initial bundle is ~2.6 MB, so serving it uncompressed costs every visitor
    # the full size on each cold load.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Build output carries a content hash in the file name, so a given URL never
    # changes content and can be cached for good.
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html has no hash: caching it would keep users on the previous release
    # after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
