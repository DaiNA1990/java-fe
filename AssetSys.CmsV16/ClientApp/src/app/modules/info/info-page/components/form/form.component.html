<!-- Dành cho admin -->
<span
  class="ms-1"
  (click)="op.toggle($event)"
  *ngIf="currentUser?.roleCodes?.includes('DEVELOP')"
>
  <i class="ki-duotone ki-information fs-7">
    <span class="path1"></span>
    <span class="path2"></span>
    <span class="path3"></span>
  </i>
</span>
<p-overlayPanel #op [dismissable]="true" [showCloseIcon]="true">
  <div style="max-height: 300px; overflow-y: auto; padding: 4px">
    <pre
      style="white-space: pre-wrap; max-width: 400px; background-color: bisque"
    >
      {{ valueTransform | json }}
    </pre>
  </div>
</p-overlayPanel>
<!--
  Chỉ render khi form đã dựng xong FormControl. Nếu không, buildControls sẽ
  render một lượt "giả" với getControl() trả về new FormControl() rỗng, rồi
  loadForm mới dựng lại — nhìn thành nháy control trắng rồi mới có dữ liệu.
  Dùng ng-container để không thêm DOM node, tránh phá flex layout của .modal-content.
-->
<ng-container
  *ngIf="(loadFormSubject | async) === false; else formLoadingTmpl"
>
  <ng-container *ngFor="let item of filterByParent(); trackBy: trackByFn">
    <ng-container
      *ngTemplateOutlet="showControlTmpl;context: {item: item, formCtrl: getControl(item)}"
    ></ng-container>
  </ng-container>
</ng-container>

<ng-template #formLoadingTmpl>
  <div class="d-flex justify-content-center align-items-center py-10">
    <span class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </span>
  </div>
</ng-template>

<ng-template
  #showControlTmpl
  let-item="item"
  let-formCtrl="formCtrl"
  let-parentData="parentData"
  let-modal="modal"
>
  <ng-container *ngIf="getTemplate(item.controlType) as template">
    <ng-container
      *ngTemplateOutlet="template; context: { item: item, formCtrl: formCtrl, parentData: parentData, modal: modal }"
    >
    </ng-container>
  </ng-container>
  <ng-container *ngIf="!getTemplate(item.controlType)">
    <span>{{ item.name }}</span>
  </ng-container>
</ng-template>

<ng-template #cardControlTmpl let-item="item" let-formCtrl="formCtrl" let-modal="modal">
  <div class="card">
    <ng-container *ngFor="let control of filterByParent(item); trackBy: trackByFn">
      <ng-container
        *ngTemplateOutlet="showControlTmpl;context: {item: control, formCtrl: getControl(control), modal: modal}"
      ></ng-container>
    </ng-container>
  </div>
</ng-template>

<ng-template #tabControlTmpl let-item="item" let-formCtrl="formCtrl" let-modal="modal">

      <ng-container *ngFor="let control of filterByParent(item); trackBy: trackByFn">
        <p-tabPanel [header]="control.name">
          <ng-container *ngFor="let tp of filterByParent(control); trackBy: trackByFn">
            <ng-container
              *ngTemplateOutlet="showControlTmpl;context: {item: tp, formCtrl: getControl(tp), modal: modal}"
            ></ng-container>
          </ng-container>
        </p-tabPanel>
      </ng-container>
    </p-tabView>
  </p-scrollPanel>
</ng-template>

<ng-template #buttonControlTmpl let-item="item" let-formCtrl="formCtrl">
  <button
    class="btn"
    [class]="item.cssClass"
    [style]="item.cssStyle"
    (click)="btnClick(item)"
    *ngIf="!isViewMode || item.referenceCode === 'SHOW_ON_VIEW'"
  >
    <ng-container *ngIf="item.icon !== null && item.icon !== ''">
      <app-keenicon [name]="item.icon" [class]="item.iconClass"></app-keenicon>
    </ng-container>
    <ng-container
      *ngIf="item.cssClass !== null && item.cssClass.indexOf('btn-icon') === -1"
    >
      {{item.name}}
    </ng-container>
  </button>
</ng-template>

<ng-template #menuControlTmpl let-item="item" let-formCtrl="formCtrl">
  <ng-container *ngIf="!isViewMode || item.referenceCode === 'SHOW_ON_VIEW'">
  <button
    class="btn btn-icon btn-color-gray-500 btn-active-color-primary"
    data-kt-menu-trigger="click"
    data-kt-menu-placement="bottom-end"
    data-kt-menu-overflow="true"
    data-kt-menu="true"
    data-kt-menu-attach="parent"
  >
    <app-keenicon name="dots-vertical" class="fs-1 text-gray300 me-n1" />
  </button>
  <div
    class="menu menu-sub menu-sub-dropdown menu-column menu-rounded menu-gray-600 menu-state-bg-light-primary fw-bold w-200px"
    data-kt-menu="true"
  >
    <div class="menu-item px-3">
      <div class="menu-content fs-6 text-gray-900 fw-bolder px-3 py-4">
        {{item.name || 'Chức năng'}}
      </div>
    </div>
    <div class="separator mb-3 opacity-75"></div>
    <div class="menu-item px-3" *ngFor="let child of filterByParent(item); trackBy: trackByFn">
      <a class="menu-link px-3 cursor-pointer" (click)="btnClick(child)">
        {{child.name}}
      </a>
    </div>
  </div>
  </ng-container>
</ng-template>

<ng-template
  #dataActionControlTmpl
  let-item="item"
  let-formCtrl="formCtrl"
  let-parentData="parentData"
>
  <app-info-data-action
    [dataId]="dataId"
    *ngIf="dataId"
    [formItem]="item"
    [formCtrl]="formCtrl"
  />
</ng-template>

  let-parentData="parentData"

    [parentData]="parentData || value"
    *ngIf="(loadFormSubject | async) === false"
  />
</ng-template>

    [parentData]="parentData || valueTransform.parentData || value"

</ng-template>

<ng-template #modalControlTmpl let-item="item" let-formCtrl="formCtrl">

    [funcCheckDirty]="funcModalDirty"

  >
    <!-- modalRef.dataId/formType được gán trước khi modal open() nên form bên trong nhận ngay ở ngOnInit -->

      <ng-container *ngFor="let control of filterByParent(item); trackBy: trackByFn">
        <ng-container
          *ngTemplateOutlet="showControlTmpl;context: {item: control, formCtrl: getControl(control), parentData: parentData, modal: modalRef}"

      </ng-container>
    </ng-template>
  </app-info-page-modal>
</ng-template>

<ng-template #readonlyControlTmpl let-item="item" let-formCtrl="formCtrl">
  <div class="mb-3 fv-row">
    <ng-container *ngTemplateOutlet="labelFormTmpl;context: {item: item}" />
    <div class="p-fluid">
      <ng-container
        *ngIf="formCtrl.value === true || formCtrl.value === false || formCtrl.value === 'True' || formCtrl.value === 'False'"
      >
        <div class="form-check">
          <input
            class="form-check-input"
            type="checkbox"
            [attr.disabled]="true"
            [checked]="formCtrl.value"
          />
          <label class="form-check-label">{{item.placeholder || ''}}</label>
        </div>
      </ng-container>
      <ng-container
        *ngIf="!(formCtrl.value === true || formCtrl.value === false || formCtrl.value === 'True' || formCtrl.value === 'False')"
      >
        <input
          type="text"
          class="form-control form-control-solid"
          [placeholder]="item.placeholder || ''"
          readonly
          [value]="formCtrl.value | formatText"
        />
      </ng-container>
    </div>
    <ng-container
      *ngIf="formCtrl !== null && formCtrl.touched && formCtrl.invalid"
    >
      <span
        class="fs-7 fv-plugins-message-container invalid-feedback"
        [innerHTML]="item.message"
      ></span>
    </ng-container>
  </div>
</ng-template>

<ng-template #plaintextControlTmpl let-item="item" let-formCtrl="formCtrl">
  <span [class]="item.cssClass" [style]="item.cssStyle">{{item.name}}</span>
</ng-template>

<ng-template #valueControlTmpl let-item="item" let-formCtrl="formCtrl">

<ng-template #labelFormTmpl let-item="item">
  <label
    [class.required]="item.isRequired && item.name"
    class="fw-semibold fs-6 mb-2"
  >
    {{item.name}}
    <ng-container *ngIf="item.hint !== null && item.hint !== ''">
      <span class="ms-1" [pTooltip]="item.hint">
        <i class="ki-duotone ki-information fs-7">
          <span class="path1"></span>
          <span class="path2"></span>
          <span class="path3"></span>
        </i>
      </span>
    </ng-container>
    <!-- Dành cho admin -->
    <span
      class="ms-1"
      (click)="op1.toggle($event)"
      *ngIf="currentUser?.roleCodes?.includes('DEVELOP') && item?.property?.code"
    >
      <i class="ki-duotone ki-information fs-7">
        <span class="path1"></span>
        <span class="path2"></span>
        <span class="path3"></span>
      </i>
    </span>
    <p-overlayPanel #op1 [dismissable]="true" [showCloseIcon]="true">
      <div>
        <pre>{{item?.property?.code}} ({{item?.property?.typeData}}) ({{item?.propertyId}})</pre>
      </div>
    </p-overlayPanel>
  </label>
</ng-template>

  [modal]="true"
