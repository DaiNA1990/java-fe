<label class="d-flex align-items-center fs-6 fw-semibold mb-2">Khai báo ánh xạ từ cột dữ liệu ra cột excel</label>
<div
  class="border border-gray-300 border-dashed rounded min-w-100px w-100 py-2 px-4 me-6 mb-3"
>
  <ng-container>
      <nb-text [ngModel]="value" [disabled]="true" placeholder="Nhập thông tin" />
  </ng-container>
  <div class="my-1 text-center">
    <a href="javascript:;" (click)="open()">
      <i class="ki-duotone ki-pencil fs-2">
        <span class="path1"></span>
        <span class="path2"></span>
      </i>
    </a>
  </div>
</div>

<p-dialog
  header="Header"
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '70rem' }"
>
  <ng-template pTemplate="header">
    <div class="inline-flex align-items-center justify-content-center gap-2">
      <span class="font-bold white-space-nowrap">Thao tác</span>
    </div>
  </ng-template>
  <div class="table-responsive mb-10">
    <label class="form-label mb-10">Thông tin hành động</label>

    <div class="border border-dashed border-gray-300 rounded px-7 py-3 mb-5">
      <div class="row mb-3">
        <div class="col-6"></div>
        <div class="col-6 text-end">
          <a
            href="javascript:;"
            class="btn btn-sm btn-icon btn-bg-light btn-active-color-primary w-30px h-30px mx-2"
            (click)="addMapColumn($event)"
          >
            <i class="ki-duotone ki-plus fs-2"></i>
          </a>
        </div>
      </div>
      <ng-container *ngFor="let item of dataMapColumns">
        <ng-container *ngTemplateOutlet="mapTemp;context: {item: item}" />
      </ng-container>
    </div>
  </div>
  <ng-template pTemplate="footer">
    <p-button
      label="Đóng"
      [text]="true"
      severity="secondary"
      styleClass="mx-3"
      (click)="visible = false"
    />
    <p-button
      label="Lưu thông tin"
      [outlined]="true"
      severity="secondary"
      (click)="save()"
    />
  </ng-template>
</p-dialog>

<ng-template #mapTemp let-item="item">
  <div class="border border-dashed border-gray-300 rounded px-3 py-3 mb-5">
    <div class="input-group mb-5">
      <input
        type="text"
        class="form-control"
        placeholder="Trường dữ liệu"
        [(ngModel)]="item.data"
      />
      <input
        type="text"
        class="form-control"
        placeholder="Cột Excel"
        [(ngModel)]="item.target"
      />
      <select class="form-select" [(ngModel)]="item.type">
				<option [value]="obj.value" *ngFor="let obj of typeDatas">{{obj.text}}</option>
			</select>
      <select class="form-select" [(ngModel)]="item.format">
        <option [value]="">--</option>
				<option [value]="obj.value" *ngFor="let obj of formatDatas">{{obj.text}}</option>
			</select>
      <a
        href="javascript:;"
        class="btn btn-sm btn-icon btn-bg-light btn-active-color-primary w-30px h-30px mx-2"
        (click)="removeMapColumn(item)"
      >
        <i class="ki-duotone ki-trash fs-2">
          <span class="path1"></span>
          <span class="path2"></span>
          <span class="path3"></span>
          <span class="path4"></span>
          <span class="path5"></span>
        </i>
      </a>
    </div>
  </div>
</ng-template>
