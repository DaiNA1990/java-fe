<p-dialog header="Header" [(visible)]="isVisible" [modal]="true" [maximizable]="false"
    [style]="{ width: '70vw', 'min-height': '50vh', border: 'none' }" [draggable]="false" [resizable]="false"
    [contentStyle]="{'background-color': '#fcfcfc', 'overflow': 'auto' }" (onHide)="onHiden()">
    <ng-template pTemplate="header">
        <span class="p-dialog-title">Xây dựng báo cáo: {{report?.name}}</span>
    </ng-template>
    <app-info-report-design [reportId]="report.id" *ngIf="report !== null" />
</p-dialog>
<p-toast></p-toast>
