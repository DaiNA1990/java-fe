<nb-page-dialog [title]="form.controls.id.value !== null ? 'Cập nhật thông tin' : 'Thêm mới'" [width]="25">
	<ng-template #edit>
		<nb-layout-grid>
			<nb-layout-grid-item size="12">
				<nb-number [formCtrl]="form.controls.groupId" label="GroupId" placeholder="Nhập thông tin" />
			</nb-layout-grid-item>
			<nb-layout-grid-item size="12">
				<nb-checkbox [formCtrl]="form.controls.isShow" label="IsShow" placeholder="Nhập thông tin" />
			</nb-layout-grid-item>
		</nb-layout-grid>
	</ng-template>    
</nb-page-dialog>
