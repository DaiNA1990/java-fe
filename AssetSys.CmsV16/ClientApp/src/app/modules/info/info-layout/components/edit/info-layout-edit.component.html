<!--GENERATE-->
<nb-page-dialog [title]="form.controls.id.value !== null ? 'Cập nhật thông tin' : 'Thêm mới'" [width]="25">
	<ng-template #edit>
		<nb-layout-grid>
			<nb-layout-grid-item size="12">
				<nb-text [formCtrl]="form.controls.name" label="Tên" placeholder="Nhập thông tin" />
			</nb-layout-grid-item>
			<nb-layout-grid-item size="12">
				<nb-text [formCtrl]="form.controls.code" label="Mã" placeholder="Nhập thông tin" />
			</nb-layout-grid-item>
			<!-- <nb-layout-grid-item size="12">
				<nb-select [formCtrl]="form.controls.typeId" [dataSource]="typeLayout" label="Loại"
					placeholder="Nhập thông tin" />
			</nb-layout-grid-item> -->
			<nb-layout-grid-item size="12">
				<nb-text [formCtrl]="form.controls.description" label="Mô tả" placeholder="Nhập thông tin" />
			</nb-layout-grid-item>
			<nb-layout-grid-item size="12">
				<nb-checkbox [formCtrl]="form.controls.isShow" label="Hoạt động" placeholder="On/Off" />
			</nb-layout-grid-item>
			<nb-layout-grid-item size="12" *ngIf="resData?.data !== null">				
				<div class="alert alert-dismissible bg-light-primary border border-primary d-flex flex-column flex-sm-row w-100 p-3">
					<div class="timeline">                                 
						<div class="timeline-item align-items-center mb-7">
							<div class="timeline-line mt-1 mb-n6 mb-sm-n7"></div>
							<div class="timeline-icon">
								<i class="ki-duotone ki-cd fs-2 text-danger"><span class="path1"></span><span class="path2"></span></i>                                   
							</div>
							<div class="timeline-content m-0">
								<span class="fs-6 text-gray-500 fw-semibold d-block">{{resData.data.dateCreated | date:'dd/MM/yyy HH:mm'}}</span>
								<span class="fs-6 fw-bold text-gray-800">{{resData.data.createdBy}}</span>
							</div>
						</div>
						<div class="timeline-item align-items-center">
							<div class="timeline-line"></div>
							<div class="timeline-icon">
								<i class="ki-duotone ki-geolocation fs-2 text-info"><span class="path1"></span><span class="path2"></span></i>                                   
							</div>
							<div class="timeline-content m-0">
								<span class="fs-6 text-gray-500 fw-semibold d-block">{{resData.data.dateUpdated | date:'dd/MM/yyy HH:mm'}}</span>
								<span class="fs-6 fw-bold text-gray-800">{{resData.data.updatedBy}}</span>
							</div>
						</div>                                        
					</div>
                </div>
			</nb-layout-grid-item>
		</nb-layout-grid>
	</ng-template>
</nb-page-dialog>
