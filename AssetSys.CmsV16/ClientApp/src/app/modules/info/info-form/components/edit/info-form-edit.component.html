<!--GENERATE-->
<nb-page-dialog [title]="form.controls.id.value !== null ? 'Cập nhật thông tin' : 'Thêm mới'" [width]="50">
	<ng-template #edit>
		<nb-layout-grid>
			<nb-layout-grid-item size="4">
				<nb-layout-grid>
					<nb-layout-grid-item size="12">
						<nb-select [formCtrl]="form.controls.propertyId" [dataSource]="propertyDS" label="Trường"
							placeholder="Nhập thông tin" />
					</nb-layout-grid-item>
					<nb-layout-grid-item size="12">
						<nb-select [formCtrl]="form.controls.parentId" [dataSource]="formDS" label="Cấp cha"
							placeholder="Nhập thông tin" />
					</nb-layout-grid-item>
					<nb-layout-grid-item size="12">
						<nb-text [formCtrl]="form.controls.name" label="Tên" placeholder="Nhập thông tin" />
					</nb-layout-grid-item>
					<nb-layout-grid-item size="12">
						<nb-select [formCtrl]="form.controls.controlType" [dataSource]="controlTypes" label="Kiểu hiển thị"
							placeholder="Nhập thông tin" />
					</nb-layout-grid-item>
					<nb-layout-grid-item size="12">
						<nb-text [formCtrl]="form.controls.hint" label="Gợi ý" placeholder="Nhập thông tin" />
					</nb-layout-grid-item>
					<nb-layout-grid-item size="12">
						<nb-text [formCtrl]="form.controls.message" label="Thông báo" placeholder="Nhập thông tin" />
					</nb-layout-grid-item>
					<nb-layout-grid-item size="12">
						<nb-checkbox [formCtrl]="form.controls.isShow" label="Hoạt động" placeholder="Nhập thông tin" />
					</nb-layout-grid-item>
					<nb-layout-grid-item size="12">
						<nb-number [formCtrl]="form.controls.size" label="Kích thước" placeholder="Nhập thông tin" />
					</nb-layout-grid-item>
					<nb-layout-grid-item size="12">
						<nb-number [formCtrl]="form.controls.displayOrder" label="Số thứ tự" placeholder="Nhập thông tin" />
					</nb-layout-grid-item>
				</nb-layout-grid>
			</nb-layout-grid-item>
			<nb-layout-grid-item size="8">
				<nb-layout-grid>
					<nb-layout-grid-item size="12">
						<nb-textarea [formCtrl]="form.controls.expressionValidate" label="Kiểm tra dữ liệu"
							placeholder="Nhập thông tin" />
					</nb-layout-grid-item>
					<nb-layout-grid-item size="12">
						<nb-textarea [formCtrl]="form.controls.expressionDisplay" label="Điều kiện hiển thị"
							placeholder="Nhập thông tin" />
					</nb-layout-grid-item>
          <nb-layout-grid-item size="12">
						<nb-textarea [formCtrl]="form.controls.expressionReadonly" label="Điều kiện ReadOnly"
							placeholder="Nhập thông tin" />
					</nb-layout-grid-item>
					<nb-layout-grid-item size="12">
						<nb-textarea [formCtrl]="form.controls.expressionData" label="Điều kiện dữ liệu"
							placeholder="Nhập thông tin" />
					</nb-layout-grid-item>
					<nb-layout-grid-item size="12">
						<nb-textarea [formCtrl]="form.controls.lookupData" label="Dữ liệu form"
							placeholder="Nhập thông tin" />
					</nb-layout-grid-item>
				</nb-layout-grid>
			</nb-layout-grid-item>
		</nb-layout-grid>
	</ng-template>
</nb-page-dialog>
