<p-dialog header="Header" [(visible)]="isVisible" [modal]="true" [maximizable]="true" [style]="{ width: '50vw' }"
	[draggable]="true" [resizable]="false" [contentStyle]="{'background-color': '#fcfcfc' }">
	<ng-template pTemplate="header">
		<span class="p-dialog-title">Lịch sử dữ liệu</span>
	</ng-template>
	<div class="timeline timeline-border-dashed">
		<div class="timeline-item" *ngFor="let item of lstData">
			<div class="timeline-line"></div>
			<div class="timeline-icon">
				<i class="ki-duotone ki-message-text-2 fs-2 text-gray-500">
					<span class="path1"></span>
					<span class="path2"></span>
					<span class="path3"></span>
				</i>
			</div>
			<div class="timeline-content mb-10 mt-n1">
				<div class="pe-3 mb-5">
					<div class="fs-5 fw-semibold mb-2">{{item.list[0].updatedBy}}</div>
					<div class="d-flex align-items-center mt-1 fs-6">
						<div class="text-muted me-2 fs-7">{{item.list[0].dateCreated | date:'dd/MM/yyy HH:mm:ss'}}</div>
					</div>
				</div>
				<div class="overflow-auto pb-5">
					<span class="badge badge-light-primary mx-2" *ngFor="let value of item.list">{{value.propertyName}}({{value.propertyCode}}):
						{{value.value}}</span>
				</div>
			</div>
		</div>
	</div>
	<ng-template pTemplate="footer">
		<div class="d-flex justify-content-end">
			<a href="javascript:;" class="btn btn-light me-5" (click)="close()">Đóng</a>
		</div>
	</ng-template>
</p-dialog>
