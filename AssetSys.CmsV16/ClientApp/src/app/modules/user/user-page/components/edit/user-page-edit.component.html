<!--GENERATE-->
<nb-page-dialog [title]="form.controls.id.value !== null ? 'Cập nhật thông tin' : 'Thêm mới'" [width]="25">
	<ng-template #edit>
		<nb-layout-grid>
			<nb-layout-grid-item size="12">
				<nb-select [formCtrl]="form.controls.parentId" [dataSource]="parentDS" fieldValue="id"
					[isFilter]="true" label="Cấp cha" placeholder="Không có cấp cha" />
			</nb-layout-grid-item>
			<nb-layout-grid-item size="12">
				<nb-text [formCtrl]="form.controls.name" label="Tên" placeholder="Nhập thông tin" />
			</nb-layout-grid-item>
			<nb-layout-grid-item size="12">
				<nb-text [formCtrl]="form.controls.code" label="Mã" placeholder="Nhập thông tin" />
			</nb-layout-grid-item>
			<nb-layout-grid-item size="12">
				<nb-number [formCtrl]="form.controls.displayOrder" label="Sắp xếp" placeholder="Nhập thông tin" />
			</nb-layout-grid-item>
			<nb-layout-grid-item size="12">
				<nb-text [formCtrl]="form.controls.router" label="Router"
					placeholder="VD: /manage-job (để trống = /info/info-page/{id})"
					message="Router phải bắt đầu bằng / và tối đa 500 ký tự" />
			</nb-layout-grid-item>
			<nb-layout-grid-item size="12">
				<nb-text [formCtrl]="form.controls.icon" label="Icon" placeholder="VD: pi pi-home"
					message="Icon tối đa 100 ký tự" />
			</nb-layout-grid-item>
			<nb-layout-grid-item size="12">
				<nb-textarea [formCtrl]="form.controls.description" label="Mô tả" placeholder="Nhập thông tin" />
			</nb-layout-grid-item>
			<nb-layout-grid-item size="12">
				<nb-checkbox [formCtrl]="form.controls.isShow" label="Trạng thái" placeholder="On/Off" />
			</nb-layout-grid-item>
		</nb-layout-grid>
	</ng-template>
</nb-page-dialog>
