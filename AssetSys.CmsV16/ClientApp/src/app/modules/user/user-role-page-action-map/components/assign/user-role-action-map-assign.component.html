<p-dialog header="Header" [(visible)]="isVisible" [modal]="true" [maximizable]="true" [style]="{ width: '50vw' }"
    [draggable]="true" [resizable]="false" [contentStyle]="{'background-color': '#fcfcfc' }">
    <ng-template pTemplate="header">
        <span class="p-dialog-title">Gán chức năng truy cập</span>
    </ng-template>
    <p-pickList [source]="source" [target]="target" sourceHeader="Chức năng truy cập" targetHeader="Chức năng được gán"
        [dragdrop]="true" [responsive]="true" [sourceStyle]="{ height: '20rem' }" [targetStyle]="{ height: '20rem' }"
        filterBy="name,pagePath,pageCode,pageRouter"
        sourceFilterPlaceholder="Tìm theo tên, nhóm cha, mã, đường dẫn..."
        targetFilterPlaceholder="Tìm theo tên, nhóm cha, mã, đường dẫn...">
        <ng-template let-action pTemplate="item">
            <div class="d-flex flex-column gap-1 py-1">
                <span class="fs-8 text-muted" *ngIf="action.pagePath">{{ action.pagePath }} ›</span>
                <span class="fs-6 fw-semibold text-gray-800">{{ action.name }}</span>
                <div class="d-flex flex-wrap gap-2" *ngIf="action.pageCode || action.pageRouter">
                    <span class="badge badge-light-primary fs-9" *ngIf="action.pageCode">{{ action.pageCode }}</span>
                    <span class="badge badge-light fs-9 text-gray-600" *ngIf="action.pageRouter">{{ action.pageRouter }}</span>
                </div>
            </div>
        </ng-template>
    </p-pickList>
    <ng-template pTemplate="footer">
        <div class="d-flex justify-content-end">
            <a href="javascript:;" class="btn btn-light me-5" (click)="close()">
                Đóng
            </a>
            <button type="submit" class="btn btn-primary" (click)="submit()">
                <span class="indicator-label">
                    Lưu thông tin
                </span>
                <span class="indicator-progress">
                    vui lòng chờ... <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                </span>
            </button>
        </div>
    </ng-template>
</p-dialog>
