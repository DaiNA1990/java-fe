<p-dialog header="Header" [(visible)]="isVisible" [modal]="true" [maximizable]="true" [style]="{ width: '50vw' }"
    [draggable]="true" [resizable]="false" [contentStyle]="{'background-color': '#fcfcfc' }">
    <ng-template pTemplate="header">
        <span class="p-dialog-title">Gán quyền truy cập</span>
    </ng-template>
    <p-pickList [source]="source" [target]="target" sourceHeader="Quyền truy cập" targetHeader="Quyền được gán"
        [dragdrop]="true" [responsive]="true" [sourceStyle]="{ height: '20rem' }" [targetStyle]="{ height: '20rem' }"
        filterBy="name" sourceFilterPlaceholder="Từ khoá tìm kiếm..." targetFilterPlaceholder="Từ khoá tìm kiếm...">
        <ng-template let-role pTemplate="item">
            <div class="flex flex-wrap p-2 align-items-center gap-3">
                <div class="flex-1 flex flex-column gap-2">
                    <span class="font-bold">
                        {{ role.name }}
                    </span>
                </div>
            </div>
        </ng-template>
    </p-pickList>
    <ng-template pTemplate="footer">
        <div class="d-flex justify-content-end">
            <a href="javascript:;" class="btn btn-light me-5" (click)="close()">
                Đóng
            </a>
            <button type="submit" class="btn btn-primary" (click)="submit()">
                <span class="indicator-label">
                    Lưu thông tin
                </span>
                <span class="indicator-progress">
                    vui lòng chờ... <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                </span>
            </button>
        </div>
    </ng-template>
</p-dialog>
