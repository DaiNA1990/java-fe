<form class="form w-100" [formGroup]="loginForm" novalidate="novalidate" id="kt_login_signin_form"
  (ngSubmit)="submit()">
  <div class="text-center mb-11">
    <h1 class="text-gray-900 fw-bolder mb-3">
      Đăng nhập
    </h1>
    <div class="text-gray-500 fw-semibold fs-6">
      Hệ thống quản trị thông tin
    </div>
  </div>
  <div class="row g-3 mb-9">
    <div class="col-md-6">
      <a href="javascript:;"
        class="btn btn-flex btn-outline btn-text-gray-700 btn-active-color-primary bg-state-light flex-center text-nowrap w-100">
        <img alt="Logo" src="./assets/media/svg/brand-logos/google-icon.svg" class="h-15px me-3" />
        Với tài khoản Google
      </a>
    </div>
    <div class="col-md-6">
      <a href="javascript:;"
        class="btn btn-flex btn-outline btn-text-gray-700 btn-active-color-primary bg-state-light flex-center text-nowrap w-100">
        <img alt="Logo" src="./assets/media/svg/brand-logos/apple-black.svg" class="theme-light-show h-15px me-3" />
        <img alt="Logo" src="./assets/media/svg/brand-logos/apple-black-dark.svg" class="theme-dark-show h-15px me-3" />
        Với tài khoản Apple
      </a>
    </div>
  </div>
  <div class="separator separator-content my-14">
    <span class="w-125px text-gray-500 fw-semibold fs-7">với email</span>
  </div>
  <ng-container *ngIf="!hasError">
    <div class="mb-10 bg-light-info p-8 rounded">
      <div class="text-info">
        Nhập <strong>thông tin</strong> đăng nhập.
      </div>
    </div>
  </ng-container>
  <ng-container *ngIf="hasError">
    <div class="mb-lg-15 alert alert-danger">
      <div class="alert-text font-weight-bold">
        {{message}}
      </div>
    </div>
  </ng-container>
  <div class="fv-row mb-8">
    <label class="form-label fs-6 fw-bolder text-gray-900">Tài khoản</label>
    <input class="form-control bg-transparent" type="email" name="email" formControlName="email" autocomplete="off"
      placeholder="Please enter info" [ngClass]="{
        'is-invalid': loginForm.controls['email'].invalid,
        'is-valid': loginForm.controls['email'].valid
      }" />
    <div class="fv-plugins-message-container invalid-feedback"
      *ngIf="loginForm.controls['email'].invalid && (loginForm.controls['email'].dirty || loginForm.controls['email'].touched)">
      <span role="alert">Vui lòng nhập tài khoản</span>
    </div>
  </div>
  <div class="fv-row mb-3">
    <label class="form-label fw-bolder text-gray-900 fs-6 mb-0">Mật khẩu</label>
    <input class="form-control bg-transparent" type="password" name="password" autocomplete="off"
      placeholder="Please enter info" formControlName="password" [ngClass]="{
        'is-invalid': loginForm.controls['password'].invalid,
        'is-valid': loginForm.controls['password'].valid
      }" />
    <div class="fv-plugins-message-container invalid-feedback"
      *ngIf="loginForm.controls['password'].invalid && (loginForm.controls['password'].dirty || loginForm.controls['password'].touched)">
      <span role="alert">Vui lòng nhập mật khẩu</span>
    </div>
  </div>
  <div class="d-flex flex-stack flex-wrap gap-3 fs-base fw-semibold mb-8">
    <div></div>
    <a routerLink="/auth/forgot-password" class="link-primary">
      Quên mật khẩu ?
    </a>
  </div>
  <div class="d-grid mb-10">
    <button type="submit" id="kt_sign_in_submit" class="btn btn-primary" [disabled]="loginForm.invalid">
      <ng-container *ngIf="isLoading$ | async">
        <span class="indicator-progress" [style.display]="'block'">
          Vui lòng chờ...
          <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
        </span>
      </ng-container>
      <ng-container *ngIf="(isLoading$ | async) === false">
        <span class="indicator-label">Đăng nhập</span>
      </ng-container>
    </button>
  </div>
  <div class="text-gray-500 text-center fw-semibold fs-6">
    Không có tài khoản?
    <a routerLink="/auth/registration" class="link-primary">
      Đăng ký
    </a>
  </div>
</form>
