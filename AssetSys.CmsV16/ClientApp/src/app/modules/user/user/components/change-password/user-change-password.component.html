<nb-page-dialog title="Đổi mật khẩu" [width]="30">
    <ng-template #edit>
        <nb-layout-grid>
            <nb-layout-grid-item size="12">
                <nb-text type="password" [formCtrl]="form.controls.currentPassword" label="Mật khẩu hiện tại"
                    placeholder="Nhập mật khẩu hiện tại..." message="Vui lòng nhập mật khẩu hiện tại" />
            </nb-layout-grid-item>
            <nb-layout-grid-item size="12">
                <nb-text type="password" [formCtrl]="form.controls.password" label="Mật khẩu mới"
                    placeholder="Nhập mật khẩu mới..." message="Vui lòng nhập mật khẩu mới" />
            </nb-layout-grid-item>
            <nb-layout-grid-item size="12">
                <nb-text type="password" [formCtrl]="form.controls.rePassword" label="Nhập lại mật khẩu mới"
                    placeholder="Nhập lại mật khẩu mới..."
                    [message]="form.controls.rePassword.hasError('notMatch') ? 'Mật khẩu nhập lại không khớp' : 'Vui lòng nhập lại mật khẩu mới'" />
            </nb-layout-grid-item>
        </nb-layout-grid>
    </ng-template>
</nb-page-dialog>
<p-toast></p-toast>
