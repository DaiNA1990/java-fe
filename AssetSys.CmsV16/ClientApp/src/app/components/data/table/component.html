<p-table *ngIf="!isTree" [value]="items" [lazy]="true" [autoLayout]="true" [totalRecords]="totalRecords" [showCurrentPageReport]="true"
    [(selection)]="selectedItems" [rowsPerPageOptions]="[10, 25, 50]"
    [currentPageReportTemplate]="isShowPagingReport ? 'Hiển thị từ {first} đến {last} của {totalRecords} bản ghi' : ''" 
    [paginator]="true" [rows]="10"
    [tableStyle]="{ 'min-width': minWidth }" 
    [scrollable]="isScrollable"
    scrollHeight="{{scrollHeight}}"
    styleClass="p-datatable-gridlines" 
    [resizableColumns]="false"
    (selectionChange)="onSelectionChange($event)" (onPage)="onPage($event)" (onSort)="onSort($event)"
    (onFilter)="onFilter($event)">
    <ng-template pTemplate="header">
        <tr>
            <th scope="col" style="width: 4rem" *ngIf="isRowCheckbox">
                <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
            </th>
            <th scope="col" *ngFor="let col of columns" [pSortableColumn]="col.canSort ? col.field : undefined">
                {{col.header}}
                <p-sortIcon [field]="col.field" *ngIf="col.canSort"></p-sortIcon>
            </th>
            <th scope="col" [ngStyle]="{'width': rowActionWidth}" *ngIf="rowActionsTemplate !== null"></th>
        </tr>
        <!-- <tr>
            <td></td>
            <td *ngFor="let col of columns" class="py-3">
                <p-columnFilter type="text" [field]="col.field"></p-columnFilter>
            </td>
            <td></td>
        </tr> -->
    </ng-template>
    <ng-template pTemplate="body" let-item>
        <tr>
             <td *ngIf="isRowCheckbox">
                <p-tableCheckbox [value]="item"></p-tableCheckbox>
            </td>           
            <td *ngFor="let col of columns">
                <ng-container *ngIf="col.columnTemplate === undefined">{{getText(item, col)}}</ng-container>
                <ng-container
                    *ngTemplateOutlet="col.columnTemplate !== undefined ? col.columnTemplate : null;context: {item: item}" />
            </td>
            <td class="text-end" *ngIf="rowActionsTemplate !== null">
                <ng-container *ngTemplateOutlet="rowActionsTemplate;context: {item: item}" />
            </td>
        </tr>
    </ng-template>
</p-table>

<!-- Chế độ cây: dữ liệu đã dựng sẵn thành TreeNode ở nb-page-list. Phân trang theo nút gốc (kèm cả nhánh con), không chọn dòng. -->
<p-treeTable *ngIf="isTree" [value]="treeNodes ?? []" [autoLayout]="true" [tableStyle]="{ 'min-width': minWidth }"
    [paginator]="true" [rows]="10" [rowsPerPageOptions]="[10, 25, 50]" [showCurrentPageReport]="true"
    [currentPageReportTemplate]="isShowPagingReport ? 'Hiển thị từ {first} đến {last} của {totalRecords} mục gốc' : ''"
    [scrollable]="isScrollable" scrollHeight="{{scrollHeight}}" styleClass="p-treetable-gridlines">
    <ng-template pTemplate="header">
        <tr>
            <th scope="col" *ngFor="let col of columns">{{col.header}}</th>
            <th scope="col" [ngStyle]="{'width': rowActionWidth}" *ngIf="rowActionsTemplate !== null"></th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-rowNode let-item="rowData">
        <tr [ttRow]="rowNode">
            <td *ngFor="let col of columns; let i = index">
                <p-treeTableToggler [rowNode]="rowNode" *ngIf="isToggleColumn(col, i)"></p-treeTableToggler>
                <ng-container *ngIf="col.columnTemplate === undefined">{{getText(item, col)}}</ng-container>
                <ng-container
                    *ngTemplateOutlet="col.columnTemplate !== undefined ? col.columnTemplate : null;context: {item: item}" />
            </td>
            <td class="text-end" *ngIf="rowActionsTemplate !== null">
                <ng-container *ngTemplateOutlet="rowActionsTemplate;context: {item: item}" />
            </td>
        </tr>
    </ng-template>
</p-treeTable>
